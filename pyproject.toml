[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matchminer-ai"
version = "0.4.0"
description = "MatchMiner-AI package"
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-NC-ND-4.0"
license-files = ["LICENSE"]
maintainers = [
  { name = "Sabrina Camp", email = "sabrinay_camp@dfci.harvard.edu" },
  { name = "Ken Kehl", email = "Kenneth_Kehl@dfci.harvard.edu" },
]
keywords = [
  "clinical-trials",
  "oncology",
  "trial-matching",
  "natural-language-processing",
  "large-language-models",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=2,<2.4",
  "pandas>=2.3",
  "pyarrow>=24.0.0",
  "pyyaml>=6.0",
  "sentence-transformers>=5.4.1",
  "torch>=2.11.0",
  "vllm>=0.20.2",
  "huggingface_hub>=1.14.0",
  "httpx>=0.27",
  "ddgs>=9.5",
  "openai>=2.45.0",
  "google-auth>=2.40.0",
  "onnxruntime>=1.27.0",
  "pypdfium2>=5.12.1",
  "rapidocr>=3.9.1",
  "trafilatura>=2.0.0",
  "transformers>=5.8.0",
]

[project.scripts]
matchminer-ai-llm-trial-check = "matchminer_ai.cli.llm_trial_check:main"
matchminer-ai-build-good-option-catalog = "matchminer_ai.cli.build_good_option_catalog:main"

[project.optional-dependencies]
guideline-conversion = ["pypdf>=6.10,<7"]
dev = [
  "pre-commit>=3.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.10",
  "types-PyYAML",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings>=0.26",
  "mkdocstrings-python>=1.10",
]
release = [
  "build>=1.2",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/dfci/matchminer-ai-inference"
Repository = "https://github.com/dfci/matchminer-ai-inference"
Issues = "https://github.com/dfci/matchminer-ai-inference/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matchminer_ai = [
  "presets/*.yaml",
  "prompts/*.txt",
  "data/*.json",
  "data/*.zip",
  "data/*.md",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = false
