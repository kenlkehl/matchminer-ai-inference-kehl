workup_query_compile:
  # One request per distinct guideline workup requirement (never per patient): the
  # answer is a declarative query, decoded under its JSON schema and validated in code.
  # An invalid query is retried with its problems named (max_attempts), then once
  # with thinking off: three retries in all.
  max_attempts: 3
  reasoning_off_fallback: true
  structured_outputs: true
  # Remote backends keep batch_size * batches_in_flight requests in flight.
  batch_size: 16
  batches_in_flight: 1
  sampling_profile: auto
  reasoning_effort: xhigh
  reasoning_parser: auto
  # Nemotron 3.5 Super reasons for 10-15k tokens; a query is 1-3k more. The prompt
  # (data model, vocabularies, query language, examples) is about 12k tokens.
  local:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    engine:
      max_model_len: 131072
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.9
      language_model_only: true
      trust_remote_code: true
      enable_prefix_caching: true
      mamba_backend: flashinfer
      mamba_ssm_cache_dtype: float16
      enable_mamba_cache_stochastic_rounding: true
      mamba_cache_philox_rounds: 5
      mamba_cache_mode: align
    chat_template_kwargs:
      enable_thinking: true
    generation:
      max_tokens: 40000
      skip_special_tokens: false
  remote:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    request_params:
      max_tokens: 40000
    extra_body:
      skip_special_tokens: false
      chat_template_kwargs:
        enable_thinking: true
workup_sql_agent:
  # The SQL workup agent (matchminer_ai.patients.workup_sql): per distinct workup requirement
  # (never per patient), an LLM explores an extraction database with read-only SQL in an
  # isolated DuckDB worker and accepts one cohort-level query; code runs it once per cohort.
  # Its only tool is read-only SQL. It needs an OpenAI-compatible endpoint (remote.enabled; a
  # local vLLM server, Vertex or another provider) or Claude through a Databricks AI Gateway
  # (remote.provider: databricks_anthropic, server_urls https://<workspace>/ai-gateway/anthropic,
  # databricks_profile, context_window), not an in-process engine. This section's remote may set
  # its own server_urls, provider, google_project_id and databricks_profile. Exploration
  # results are patient-derived extracted values (no ids, note text or quotes): use only an
  # endpoint authorized for the records.
  # Attempts per turn for an invalid action (validated in code).
  max_attempts: 3
  structured_outputs: true
  # bytes: conservative local prompt budgets; endpoint: count with the server's /tokenize.
  tokenizer_mode: bytes
  # null: local.engine.max_model_len.
  context_window: null
  # Seconds a turn's request may go without data before it is retried (remote.request_timeout,
  # hours for long summaries, would let one stalled call hold an item that long). A 429/503 is
  # waited out within max_attempts.
  request_timeout: 600
  sampling_profile: auto
  reasoning_effort: high
  reasoning_parser: auto
  limits:
    max_actions: 12
    max_submits: 3
    # The agent is asked to submit a first candidate by this action, then review and revise.
    submit_by: 6
    # Checking queries allowed after a valid submission; then the agent must accept it or
    # submit a revision (code removes the query action).
    max_review_queries: 3
    # Rows and characters of an exploration result the agent sees.
    max_rows: 30
    max_cell_chars: 160
    max_result_chars: 6000
    max_memory_chars: 4000
    max_recent_steps: 8
    # Words per search action, and matching text values (rare ones included) it shows.
    max_search_terms: 8
    max_search_rows: 50
    max_sql_chars: 16000
    max_detail_chars: 300
    max_evidence_items: 8
    sample_rows_per_status: 3
    # Requirements explored at once; they share one SQL worker. Each turn is one request,
    # so this many requests are in flight (remote.max_concurrent_requests is raised to it).
    max_concurrent_items: 8
    query_timeout_seconds: 20
    final_timeout_seconds: 120
    worker_memory_mb: 4096
    duckdb_memory_mb: 2048
  local:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    engine:
      max_model_len: 131072
    chat_template_kwargs:
      enable_thinking: true
    generation:
      max_tokens: 32000
      skip_special_tokens: false
  remote:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    request_params:
      max_tokens: 32000
    extra_body:
      skip_special_tokens: false
      chat_template_kwargs:
        enable_thinking: true
