embedding:
  # TrialSpace embeds key text only: cohort key criteria and patient key sections.
  # The n=5000 run's round-2 TrialSpace (google/embeddinggemma-2 fine-tuned by the training
  # repository's finetune_embedder.py; stage receipt d7ef7270...), a local, unpublished directory
  # on purpose (user, 2026-11-12): where it is missing or unreadable, embedding fails rather than
  # mix vectors from another model. Nothing falls back to TrialSpace-0526 or any Hub model.
  # Loading it needs sentence-transformers >= 6.1, which saved it.
  model_path: "/ksg/kehl_mm_data/mmai/v23/data/no_phi/synthetic_dataset_n5000_screened_20261106/trialspace/models/trialspace_round2"
  device: cuda
  # Encoded as training's mining encodes it (trialspace/mining.py encoder_settings): float32
  # weights with bfloat16 autocast on CUDA, the trialspace prompt profile (patients get
  # patient_summary, cohorts this_space), mean pooling over the prompt too, the text tower
  # only, batches of 32, normalized vectors.
  dtype: float32
  autocast: bfloat16
  prompt_profile: trialspace
  default_prompt_name: SentenceSimilarity
  include_prompt_in_pooling: true
  text_only: true
  batch_size: 32
  # The query prompt for a model that saved none and has no prompt profile (unused here).
  prompt_file: embedding.txt
  # The fit's token cap (finetune_embedder.py, max_tokens 4096).
  max_seq_length: 4096
# The decision model answers the match, boilerplate and per-criterion yes/no questions
# (matching/decision_model.py). Base LiquidAI/d1-2B (LFM Open License v1.0) at a pinned commit, or a
# fine-tuned checkpoint directory from the training repository's train_decision_model.py. Its own
# model code runs (trust_remote_code), so a Hub model must pin its revision.
decision_model:
  model_name: "LiquidAI/d1-2B"
  revision: "652f920e544ea37f81e4b0ce89b81d4ed0da90b1"
  backend: transformers
  device: cuda
  dtype: bfloat16
  # The fine-tuning length; longer requests still run (no truncation) and are counted.
  max_length: 10000
  # Questions read together after one state; null = the model's trained size (16).
  set_size: null
  # Padded tokens per forward pass, and requests per call.
  token_budget: 65536
  batch_size: 256
  compile: false
match_quality:
  # match_quality_score (the expected 0-6 match score / 6) at or above this passes.
  score_cutoff: 0.2
exclusion_criteria:
  # P(potentially eligible on the boilerplate criteria) at or above this passes.
  pass_cutoff: 0.5
criteria_check:
  # A criterion line whose P(yes = not clearly failing) is below this is flagged as clearly failed.
  fail_cutoff: 0.5
