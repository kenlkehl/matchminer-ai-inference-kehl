version: 0
debug_mode: false
model_metadata_cache_dir: ".mmai_cache/model_metadata"
remote:
  enabled: false
  provider: openai
  server_urls:
    - http://localhost:8000/v1
  max_concurrent_requests: 32
  adaptive_concurrency:
    enabled: true
    initial: 32
    minimum: 1
    success_threshold: 32
    increase_step: 32
    adjustment_interval: 10.0
    backoff_factor: 0.5
    # Optional vLLM /metrics feedback; zero uses transport outcomes only.
    metrics_interval: 0
  request_timeout: 600
  max_retries: 6
  batch_size: 1000
  retry_backoff_base: 1.0
trial:
  extraction_method: cohorts
  cohorts:
    # ctgov listings and protocols share the three cohort prompts
    # (trials/cohort_workflow.py): screen, cohort names, criteria per cohort.
    max_attempts: 3
    # Constrain each remote answer to its step's JSON schema.
    structured_outputs: true
    # A remote backend keeps chunk_size * chunks_in_flight requests in flight,
    # each sent as another returns; a local one gets batches of chunk_size.
    chunk_size: 500
    chunks_in_flight: 2
  hierarchy:
    max_attempts: 4
    max_nodes: 4096
    max_calls: 20000
    batch_size: 256
    active_trials: 32
  sampling_profile: auto
  reasoning_effort: xhigh
  reasoning_parser: auto
  # Every local engine serves Nemotron 3.5 Super as the production vLLM servers do: remote code,
  # text only, prefix caching and its hybrid Mamba cache settings (vllm.LLM keyword arguments).
  local:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    engine:
      max_model_len: 100000
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.9
      language_model_only: true
      trust_remote_code: true
      enable_prefix_caching: true
      mamba_backend: flashinfer
      mamba_ssm_cache_dtype: float16
      enable_mamba_cache_stochastic_rounding: true
      mamba_cache_philox_rounds: 5
      mamba_cache_mode: align
    chat_template_kwargs:
      enable_thinking: true
    generation:
      max_tokens: 50000
      skip_special_tokens: false
  remote:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    request_params:
      max_tokens: 50000
    extra_body:
      skip_special_tokens: false
      chat_template_kwargs:
        enable_thinking: true
  prompt_files:
    primer: trial.user.primer.txt
    question: trial.user.question.txt
  boilerplate_marker: Boilerplate exclusions
patient:
  sampling_profile: auto
  reasoning_effort: xhigh
  reasoning_parser: auto
  chunk_size: 50000
  chunk_overlap: 500
  prompt_margin_tokens: 5000
  # continuous: a remote backend sends each patient's next chunk as soon as
  # the previous one is final, keeping its request capacity in flight; a local
  # engine, which batches prompts itself, and rounds send every patient's Nth
  # chunk together, round by round.
  scheduling: continuous
  local:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    engine:
      max_model_len: 200000
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.9
      language_model_only: true
      trust_remote_code: true
      enable_prefix_caching: true
      mamba_backend: flashinfer
      mamba_ssm_cache_dtype: float16
      enable_mamba_cache_stochastic_rounding: true
      mamba_cache_philox_rounds: 5
      mamba_cache_mode: align
    chat_template_kwargs:
      enable_thinking: true
    generation:
      max_tokens: 50000
      skip_special_tokens: false
  remote:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    tokenizer_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    request_params:
      max_tokens: 50000
    extra_body:
      skip_special_tokens: false
      chat_template_kwargs:
        enable_thinking: true
  prompt_files:
    primer: patient.serial.user.primer.txt
    question: patient.serial.user.question.txt
  text_token_threshold: 95000
# Structured clinical extraction (patients/extraction): research abstraction aids that
# need human review. Every item carries exact quotes located in the note in code.
document_extraction:
  # One request per note. Longer notes fail rather than being truncated.
  max_document_characters: 200000
  # Attempts per note for an invalid answer or a quote not found in the note, then
  # one more with thinking off. After the last, items without a found quote are dropped.
  max_attempts: 3
  reasoning_off_fallback: true
  # Constrain each remote answer to the record's JSON schema (vLLM structured outputs).
  structured_outputs: true
  # A local backend gets batches of batch_size, batches_in_flight at once. A remote one
  # keeps remote.max_concurrent_requests requests per server in flight (at least
  # batch_size * batches_in_flight), each sent as another returns.
  batch_size: 256
  batches_in_flight: 2
  # Disease-specific item types and guidance, by name (packaged: thoracic).
  extensions: []
  # Add NCIt codes to treatment agents from the bundled NCIt snapshot.
  ncit_agent_codes: false
  sampling_profile: auto
  reasoning_effort: xhigh
  reasoning_parser: auto
  # Nemotron 3.5 Super often reasons for 10-15k tokens and the answer's quotes come on top;
  # a synthetic molecular report took 29,867 completion tokens (2026-11-12).
  local:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    engine:
      max_model_len: 131072
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.9
      language_model_only: true
      trust_remote_code: true
      enable_prefix_caching: true
      mamba_backend: flashinfer
      mamba_ssm_cache_dtype: float16
      enable_mamba_cache_stochastic_rounding: true
      mamba_cache_philox_rounds: 5
      mamba_cache_mode: align
    chat_template_kwargs:
      enable_thinking: true
    generation:
      max_tokens: 50000
      skip_special_tokens: false
  remote:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    request_params:
      max_tokens: 50000
    extra_body:
      skip_special_tokens: false
      chat_template_kwargs:
        enable_thinking: true
patient_extraction:
  # Notes in date order, packed into chunks of chunk_tokens (a longer note is split
  # with chunk_overlap_tokens overlap). Each chunk's request sees the record so far
  # and returns only new and changed items.
  chunk_tokens: 40000
  chunk_overlap_tokens: 500
  # The context a chunk's prompt plus max_tokens must fit; null uses
  # local.engine.max_model_len.
  context_tokens: null
  max_attempts: 3
  reasoning_off_fallback: true
  structured_outputs: true
  # As in document_extraction: local batches of batch_size; a remote backend keeps
  # remote.max_concurrent_requests requests per server in flight (at least
  # batch_size * batches_in_flight).
  batch_size: 64
  batches_in_flight: 2
  extensions: []
  ncit_agent_codes: false
  sampling_profile: auto
  reasoning_effort: xhigh
  reasoning_parser: auto
  local:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    engine:
      max_model_len: 200000
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.9
      language_model_only: true
      trust_remote_code: true
      enable_prefix_caching: true
      mamba_backend: flashinfer
      mamba_ssm_cache_dtype: float16
      enable_mamba_cache_stochastic_rounding: true
      mamba_cache_philox_rounds: 5
      mamba_cache_mode: align
    chat_template_kwargs:
      enable_thinking: true
    generation:
      max_tokens: 60000
      skip_special_tokens: false
  remote:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
