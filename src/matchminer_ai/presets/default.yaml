embedding:
  # TrialSpace embeds key text only: cohort key criteria and patient key sections.
  # model_path names your TrialSpace checkpoint (google/embeddinggemma-2 fine-tuned by
  # matchminer_ai.training). Unset, it comes from the site config's paths.trialspace_model;
  # with neither, embedding fails. Nothing falls back to TrialSpace-0526 or any Hub model, so
  # vectors from different models are never mixed. Loading a checkpoint saved by
  # sentence-transformers >= 6.1 needs that version.
  model_path: null
  device: cuda
  # Encoded as training's mining encodes it (trialspace/mining.py encoder_settings): float32
  # weights with bfloat16 autocast on CUDA, the trialspace prompt profile (patients get
  # patient_summary, cohorts this_space), mean pooling over the prompt too, the text tower
  # only, batches of 32, normalized vectors.
  dtype: float32
  autocast: bfloat16
  prompt_profile: trialspace
  default_prompt_name: SentenceSimilarity
  include_prompt_in_pooling: true
  text_only: true
  batch_size: 32
  # The query prompt for a model that saved none and has no prompt profile (unused here).
  prompt_file: embedding.txt
  # The fit's token cap (finetune_embedder.py, max_tokens 4096).
  max_seq_length: 4096
# The decision model answers the match, boilerplate and per-criterion yes/no questions
# (matching/decision_model.py). Base LiquidAI/d1-2B (LFM Open License v1.0) at a pinned commit, or a
# fine-tuned checkpoint directory from the training repository's train_decision_model.py. Its own
# model code runs (trust_remote_code), so a Hub model must pin its revision.
decision_model:
  model_name: "LiquidAI/d1-2B"
  revision: "652f920e544ea37f81e4b0ce89b81d4ed0da90b1"
  backend: transformers
  device: cuda
  dtype: bfloat16
  # The fine-tuning length; longer requests still run (no truncation) and are counted.
  max_length: 10000
  # Questions read together after one state; null = the model's trained size (16).
  set_size: null
  # Padded tokens per forward pass, and requests per call.
  token_budget: 65536
  batch_size: 256
  compile: false
match_quality:
  # match_quality_pass: P(reasonable) (the decision model's potentially-eligible answer) at or above this.
  # match_quality_score (the expected 0-6 match score / 6) ranks pairs; it is not a pass criterion
  # (until 2026-11-17 a score cutoff of 0.2 was, which only approximated this answer).
  reasonableness_cutoff: 0.5
exclusion_criteria:
  # P(potentially eligible on the boilerplate criteria) at or above this passes.
  pass_cutoff: 0.5
criteria_check:
  # A criterion line whose P(yes = not clearly failing) is below this is flagged as clearly failed.
  fail_cutoff: 0.5
# check_eligibility_criteria_with_llm: the LLM alternative to the decision model's per-criterion check, one request
# per line with the per-criterion teacher prompt (criterion_check.labels.user.txt, the question-7 label contract).
llm_criteria_check:
  # Constrain each remote answer to CRITERION_LABEL_JSON_SCHEMA (structured outputs, after the reasoning).
  structured_outputs: true
  # Attempts for a line whose answer fails validation (each retry names the validation error).
  max_attempts: 3
  # A remote backend keeps chunk_size * chunks_in_flight requests in flight, each sent as another returns;
  # a local one gets batches of chunk_size.
  chunk_size: 64
  chunks_in_flight: 1
  sampling_profile: auto
  reasoning_effort: xhigh
  reasoning_parser: auto
  # The training teacher's output budget (32,768 tokens, reasoning included).
  local:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    engine:
      max_model_len: 100000
      tensor_parallel_size: 1
