# Structured clinical extraction (patients/extraction): research abstraction aids that
# need human review. Every item carries exact quotes located in the note in code.
document_extraction:
  # One request per note. Longer notes fail rather than being truncated.
  max_document_characters: 200000
  # Attempts per note for an invalid answer or a quote not found in the note, then
  # one more with thinking off. After the last, items without a found quote are dropped.
  max_attempts: 3
  reasoning_off_fallback: true
  # Constrain each remote answer to the record's JSON schema (vLLM structured outputs).
  structured_outputs: true
  # A remote backend keeps batch_size * batches_in_flight requests in flight, each sent
  # as another returns; a local one gets batches of batch_size.
  batch_size: 256
  batches_in_flight: 2
  # Disease-specific item types and guidance, by name (packaged: thoracic).
  extensions: []
  # Add NCIt codes to treatment agents from the bundled NCIt snapshot.
  ncit_agent_codes: false
  sampling_profile: auto
  reasoning_effort: xhigh
  reasoning_parser: auto
  # Nemotron 3.5 Super often reasons for 10-15k tokens and the answer's quotes come on top;
  # a synthetic molecular report took 29,867 completion tokens (2026-11-12).
  local:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    engine:
      max_model_len: 131072
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.9
      language_model_only: true
      trust_remote_code: true
      enable_prefix_caching: true
      mamba_backend: flashinfer
      mamba_ssm_cache_dtype: float16
      enable_mamba_cache_stochastic_rounding: true
      mamba_cache_philox_rounds: 5
      mamba_cache_mode: align
    chat_template_kwargs:
      enable_thinking: true
    generation:
      max_tokens: 50000
      skip_special_tokens: false
  remote:
