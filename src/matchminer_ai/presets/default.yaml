good_option_catalog:
  ncit_resource: Thesaurus_26.07d.FLAT.zip
  ncit_version: 26.07d
  good_option_summary_max_tokens: 6000
  help_me_choose_summary_max_tokens: 9000
  class_option_summary_max_tokens: 4000
  # Evidence is no longer truncated to fit one call. It is chunked, and a running
  # synthesis is carried across the chunks, so nothing is discarded unread. This
  # bounds one chunk; the whole ledger is covered however many chunks that takes.
  # A chunk, the carried-forward facts (up to ~30k tokens), and the 100k
  # synthesis completion budget must fit together in a 262,144-token context.
  synthesis_chunk_max_tokens: 60000
  # Retained for tooling that still reports a whole-ledger budget.
  synthesis_evidence_max_tokens: 190000
  # Class synthesis is a separate call on its own budget, so a large shared
  # class corpus can never evict an agent's own passages.
  class_evidence_max_tokens: 60000
  class_assignment_evidence_max_tokens: 40000
  class_max_per_drug: 3
  screening_max_attempts: 3
  synthesis_max_attempts: 3
  class_assignment_max_attempts: 3
  screening_checkpoint_batch_size: 64
  class_checkpoint_batch_size: 64
  screening_llm:
    local:
      generation:
        max_tokens: 8000
    remote:
      request_params:
        max_tokens: 8000
  synthesis_llm:
    local:
      generation:
        max_tokens: 100000
    remote:
      request_params:
        max_tokens: 100000
  class_llm:
    local:
      generation:
        max_tokens: 6000
    remote:
      request_params:
        max_tokens: 6000
# Patient-time packing of catalog drug and class evidence into the
# llm_good_option prompt. Kept outside llm_good_option and good_option_catalog,
# which fingerprint catalog checkpoints. Evidence gets what the context leaves
# after the completion allowance (llm_good_option max_tokens) and this margin.
good_option_prompt:
  # null uses llm_good_option.local.engine.max_model_len; set it explicitly
  # when a remote endpoint serves a different context length.
  context_tokens: null
  # Conservative: Gemma 4 averages ~4.4 characters per token on catalog text.
  chars_per_token: 3.5
  safety_tokens: 4096
  # Upper bound on any one drug or class, however much room remains.
  max_drug_section_tokens: 20000
  max_class_section_tokens: 20000
# On-demand check_good_options settings. Kept apart from llm_good_option, whose
# values feed catalog-build checkpoint fingerprints.
good_option_check:
  # Completion cap for on-demand checks; the rest of the context carries
  # evidence. Catalog builds keep llm_good_option's own max_tokens.
  max_output_tokens: 50000
  # When good_option_prompt.context_tokens is null and the remote backend is
  # OpenAI-compatible, size evidence to the smallest max_model_len reported by
  # the configured servers' /models listing.
  discover_context_tokens: true
  discovery_timeout_seconds: 10.0
  # Attempts for an invalid answer, then one more with thinking disabled.
  max_parse_attempts: 3
  reasoning_off_fallback: true
# Deprecated: GoodOption scoring uses the LLM teacher (llm_good_option). Kept so
# existing configs load; no checker artifact is published or maintained.
good_option_checker:
  model_name: ""
  device: cuda
  max_length: 8192
