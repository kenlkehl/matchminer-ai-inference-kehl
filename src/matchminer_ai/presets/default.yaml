version: 0
debug_mode: false
model_metadata_cache_dir: ".mmai_cache/model_metadata"
remote:
  enabled: false
  provider: openai
  server_urls:
    - http://localhost:8000/v1
  max_concurrent_requests: 32
  adaptive_concurrency:
    enabled: true
    initial: 32
    minimum: 1
    success_threshold: 32
    increase_step: 32
    adjustment_interval: 10.0
    backoff_factor: 0.5
    # Optional vLLM /metrics feedback; zero uses transport outcomes only.
    metrics_interval: 0
  request_timeout: 600
  max_retries: 6
  batch_size: 1000
  retry_backoff_base: 1.0
trial:
  extraction_method: cohorts
  cohorts:
    # ctgov listings and protocols share the three cohort prompts
    # (trials/cohort_workflow.py): screen, cohort names, criteria per cohort.
    max_attempts: 3
    # Constrain each remote answer to its step's JSON schema.
    structured_outputs: true
    # A remote backend keeps chunk_size * chunks_in_flight requests in flight,
    # each sent as another returns; a local one gets batches of chunk_size.
    chunk_size: 500
    chunks_in_flight: 2
  hierarchy:
    max_attempts: 4
    max_nodes: 4096
    max_calls: 20000
    batch_size: 256
    active_trials: 32
  sampling_profile: auto
  reasoning_effort: xhigh
  reasoning_parser: auto
  # Every local engine serves Nemotron 3.5 Super as the production vLLM servers do: remote code,
  # text only, prefix caching and its hybrid Mamba cache settings (vllm.LLM keyword arguments).
  local:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    engine:
      max_model_len: 100000
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.9
      language_model_only: true
      trust_remote_code: true
      enable_prefix_caching: true
      mamba_backend: flashinfer
      mamba_ssm_cache_dtype: float16
      enable_mamba_cache_stochastic_rounding: true
      mamba_cache_philox_rounds: 5
      mamba_cache_mode: align
    chat_template_kwargs:
      enable_thinking: true
    generation:
      max_tokens: 50000
      skip_special_tokens: false
  remote:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    request_params:
      max_tokens: 50000
    extra_body:
      skip_special_tokens: false
      chat_template_kwargs:
        enable_thinking: true
  prompt_files:
    primer: trial.user.primer.txt
    question: trial.user.question.txt
  boilerplate_marker: Boilerplate exclusions
patient:
  sampling_profile: auto
  reasoning_effort: xhigh
  reasoning_parser: auto
  chunk_size: 50000
  chunk_overlap: 500
  prompt_margin_tokens: 5000
  local:
    model_name: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
