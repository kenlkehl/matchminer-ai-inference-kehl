      mamba_cache_philox_rounds: 5
      mamba_cache_mode: align
    chat_template_kwargs:
      enable_thinking: true
    generation:
      temperature: 0.0
      top_k: 1
      top_p: 1.0
      min_p: 0.0
      max_tokens: 16000
      repetition_penalty: 1.05
